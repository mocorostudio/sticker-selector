<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f6"><title>動物スタンプ選抜 v9</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#242424;background:#faf9f6}*{box-sizing:border-box}body{margin:0;padding:16px 12px 55px}header{position:relative;max-width:620px;margin:auto}h1{font-size:21px;margin:10px 0}button,.filebtn,select{font:inherit;border:1px solid #bdbdbd;border-radius:10px;background:#fff;color:#222;padding:10px 12px;min-height:44px}button:active,.filebtn:active{background:#ddd}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.filebtn{display:inline-flex;align-items:center;cursor:pointer}.filebtn input{display:none}.muted{font-size:12px;color:#686868;line-height:1.6}.notice{font-size:12px;color:#844608;margin:12px 0}.status{font-size:13px;margin:12px 0;font-weight:600}.list{max-width:620px;margin:15px auto;display:grid;gap:16px}.card{background:#fff;border-radius:15px;border:1px solid #e2e2e2;overflow:hidden}.stage{display:flex;align-items:center;justify-content:center;height:310px;padding:18px}.stage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}.white{background:#fff}.black{background:#141414}.checker{background-color:#fff;background-image:linear-gradient(45deg,#d6d6d6 25%,transparent 25%),linear-gradient(-45deg,#d6d6d6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d6d6d6 75%),linear-gradient(-45deg,transparent 75%,#d6d6d6 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.meta{padding:14px}.filename{font-size:13px;overflow-wrap:anywhere}.choices{display:flex;gap:10px;margin:10px 0}.choices label{flex:1;text-align:center;padding:10px 0;border:1px solid #bbb;border-radius:10px;font-size:23px;cursor:pointer}.choices label.chosen{border:2px solid #36845b;background:#e3f3e8;padding:9px 0}.choices input{position:absolute;opacity:0;pointer-events:none}.comment{display:block;width:100%;font-size:16px;border:1px solid #ccc;border-radius:9px;padding:10px}small{font-size:12px;color:#666}.footer-buttons{max-width:620px;margin:22px auto;display:flex;gap:10px;flex-wrap:wrap}dialog{border:0;border-radius:12px;padding:12px;max-width:95vw;background:#fff}dialog img{max-width:87vw;max-height:75vh}#error{color:#b42121;font-size:13px}
</style></head><body><header><h1>動物LINEスタンプ選抜 v9</h1><div class="controls"><label class="filebtn">PNGを追加<input id="files" type="file" multiple accept="image/png"></label><label class="filebtn">ZIPを追加<input id="zip" type="file" accept=".zip,application/zip"></label><select id="background" aria-label="確認用背景"><option value="checker">市松背景</option><option value="white">白背景</option><option value="black">黒背景</option></select></div><div class="status" id="status"></div><div class="notice">初期の◯は仮表示です。評価をタップした画像だけ「操作済」になります。ここでの操作はGoogle Driveを変更しません。</div><div id="error"></div></header><main class="list" id="list"></main><div class="footer-buttons"><button id="setAll">全件◯にする</button><button id="json">選抜結果JSONを保存</button><button id="csv">CSVを保存</button></div><p class="muted" style="max-width:620px;margin:auto">この端末のブラウザ内に画像と評価を保存します。ブラウザデータを削除すると失われる場合があるため、定期的にJSON/CSVを書き出してください。ZIP読込には最初だけネット接続が必要です。</p><dialog id="zoom"><button id="close">閉じる</button><div style="text-align:center"><img id="zoomimg" alt="拡大画像"></div></dialog>
<script>
'use strict';
const STORE='sticker-selector-v9',DB='sticker-selector-images-v9';
let state;try{state=JSON.parse(localStorage.getItem(STORE))}catch(_){};if(!state||!Array.isArray(state.items))state={items:[],background:'checker'};
let db;const $=x=>document.getElementById(x);const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
function openDb(){return new Promise((ok,no)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('images');q.onsuccess=()=>{db=q.result;ok()};q.onerror=()=>no(q.error)})}
function put(id,blob){return new Promise((ok,no)=>{let q=db.transaction('images','readwrite').objectStore('images').put(blob,id);q.onsuccess=ok;q.onerror=()=>no(q.error)})}
function get(id){return new Promise((ok,no)=>{let q=db.transaction('images','readonly').objectStore('images').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
let urls=[];function clearURLs(){urls.forEach(x=>URL.revokeObjectURL(x));urls=[]}
function redraw(){clearURLs();save();$('background').value=state.background;let tally={o:0,h:0,x:0};for(let i of state.items)if(i.touched&&tally[i.rating]!==undefined)tally[i.rating]++;$('status').textContent=`全${state.items.length}枚 / ◯ ${tally.o} / △ ${tally.h} / ✕ ${tally.x} / 未選抜 ${state.items.length-tally.o-tally.h-tally.x}`;let list=$('list');list.replaceChildren();state.items.forEach((it,index)=>{const card=document.createElement('article');card.className='card';const stage=document.createElement('div');stage.className='stage '+state.background;const img=document.createElement('img');img.alt=it.name;stage.append(img);card.append(stage);const meta=document.createElement('div');meta.className='meta';const name=document.createElement('div');name.className='filename';name.textContent=`${index+1}. ${it.name}`;meta.append(name);const choices=document.createElement('div');choices.className='choices';for(const [v,txt] of [['o','◯'],['h','△'],['x','✕']]){const label=document.createElement('label');if(it.touched&&it.rating===v)label.classList.add('chosen');const input=document.createElement('input');input.type='radio';input.name='vote'+index;input.value=v;input.checked=it.touched&&it.rating===v;label.append(input,document.createTextNode(txt));input.onchange=()=>{it.rating=v;it.touched=true;redraw()};choices.append(label)}meta.append(choices);const comment=document.createElement('input');comment.className='comment';comment.placeholder='コメント（任意）';comment.value=it.comment||'';comment.oninput=e=>{it.comment=e.target.value;save()};meta.append(comment);const note=document.createElement('small');note.textContent=it.touched?'操作済':'未選抜（仮◯）';meta.append(note);card.append(meta);list.append(card);get(it.id).then(blob=>{if(blob){const url=URL.createObjectURL(blob);urls.push(url);img.src=url}else note.textContent='画像を再追加してください'}).catch(()=>note.textContent='画像読込失敗');img.onclick=()=>{if(img.src){$('zoomimg').src=img.src;$('zoom').showModal()}}})}
async function addPNG(blob,name){if(!name.toLowerCase().endsWith('.png'))return;if(blob.size>15e6)throw Error('大きすぎるPNG: '+name);const id=name+'|'+blob.size+'|'+blob.lastModified;if(state.items.some(x=>x.id===id))return;await put(id,blob);state.items.push({id,name,rating:'o',touched:false,comment:''})}
$('files').onchange=async e=>{try{for(const f of e.target.files)await addPNG(f,f.name);redraw()}catch(err){$('error').textContent=err.message}e.target.value=''};
$('zip').onchange=async e=>{try{if(!window.JSZip){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=resolve;s.onerror=reject;document.head.append(s)})}const zip=await JSZip.loadAsync(e.target.files[0]);for(let f of Object.values(zip.files)){if(f.dir||!f.name.toLowerCase().endsWith('.png')||f.name.startsWith('__MACOSX/'))continue;const b=await f.async('blob');await addPNG(new File([b],f.name.split('/').pop(),{type:'image/png'}),f.name)}redraw()}catch(err){$('error').textContent='ZIP読み込みに失敗しました。通信状態を確認するかPNGを追加してください。'}e.target.value=''};
$('background').onchange=e=>{state.background=e.target.value;redraw()};$('close').onclick=()=>$('zoom').close();
$('setAll').onclick=()=>{if(!confirm('全画像を◯で操作済にしますか？'))return;state.items.forEach(x=>{x.rating='o';x.touched=true});redraw()};
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function exportRows(){return state.items.map(i=>({image_id:i.id,filename:i.name,rating:i.touched?i.rating:null,confirmed:i.touched,comment:i.comment||''}))}
$('json').onclick=()=>download('sticker-selection-v9.json',JSON.stringify({schema_version:9,drive_synced:false,exported_at:new Date().toISOString(),items:exportRows()},null,2),'application/json');
$('csv').onclick=()=>{const row=[['image_id','filename','rating','confirmed','comment'],...exportRows().map(x=>[x.image_id,x.filename,x.rating||'',x.confirmed,x.comment])];download('sticker-selection-v9.csv',row.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};
openDb().then(redraw).catch(e=>$('error').textContent='このブラウザで端末保存が利用できません。別のブラウザで開いてください。');
</script></body></html>
