name: Sticker app checks
on:
  push:
    paths:
      - '*.html'
      - 'tests/**'
      - '.github/workflows/sticker-check.yml'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HTML JavaScript and essential UI
        run: node tests/check-stickers.mjs
