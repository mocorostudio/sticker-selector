name: Sticker app checks
on:
  push:
    paths:
      - '*.html'
      - 'tests/**'
      - '.github/workflows/sticker-check.yml'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HTML JavaScript and essential UI
        run: node tests/check-stickers.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser startup smoke test
        run: node tests/browser-smoke.mjs
      - name: Save screenshots when browser test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sticker-browser-failure
          path: test-results/
          if-no-files-found: ignore
