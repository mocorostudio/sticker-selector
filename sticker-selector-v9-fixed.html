<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>動物LINEスタンプ選抜 v9 改良版</title><style>
:root{font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:#222;background:#faf9f6}*{box-sizing:border-box}body{margin:0;padding:16px 12px 60px}header,main,section,footer{max-width:620px;margin:auto}h1{font-size:21px}button,select,input{font:inherit}button,select,.filebtn{border:1px solid #bbb;border-radius:10px;background:white;padding:10px;min-height:44px;color:#222}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.filebtn{display:inline-flex;align-items:center}.filebtn input{display:none}.muted{font-size:12px;color:#555;line-height:1.6}.notice{font-size:12px;color:#795008;padding:8px 0}.status{font-size:13px;font-weight:600;margin:12px 0}.drive-panel{border:1px solid #ddd;background:#fff;padding:13px;border-radius:14px;margin:12px auto}.drive-panel input{width:100%;padding:10px;margin:8px 0;font-size:16px}.drive-panel button{margin:4px 4px 4px 0}.drive-log{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin-top:10px}#error{color:#b21d1d;font-size:13px}.list{display:grid;gap:16px;margin-top:15px}.card{background:#fff;border:1px solid #ddd;border-radius:15px;overflow:hidden}.stage{height:310px;padding:18px;display:flex;align-items:center;justify-content:center}.stage img{max-width:100%;max-height:100%;object-fit:contain}.white{background:#fff}.black{background:#141414}.checker{background-color:white;background-image:linear-gradient(45deg,#d6d6d6 25%,transparent 25%),linear-gradient(-45deg,#d6d6d6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d6d6d6 75%),linear-gradient(-45deg,transparent 75%,#d6d6d6 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.meta{padding:14px}.filename{font-size:13px;overflow-wrap:anywhere}.choices,.per-bg{display:flex;gap:9px;margin:10px 0}.choices label{flex:1;border:1px solid #bbb;border-radius:10px;text-align:center;padding:10px 0;font-size:23px}.choices label.chosen,.per-bg button.active{border:2px solid #36845b;background:#e3f3e8}.choices input{position:absolute;opacity:0;pointer-events:none}.per-bg button{flex:1;min-height:38px;font-size:14px;padding:7px 2px}.comment{width:100%;border:1px solid #ccc;border-radius:9px;padding:10px}small{font-size:12px;color:#666}footer{display:flex;flex-wrap:wrap;gap:8px;margin:20px auto}dialog{border:none;border-radius:14px;max-width:95vw}dialog img{max-width:88vw;max-height:75vh}
</style></head><body><header><h1>動物LINEスタンプ選抜 v9</h1><div class="controls"><label class="filebtn">PNGを選ぶ<input id="files" type="file" multiple accept="image/png"></label><label class="filebtn">ZIPを選ぶ<input id="zip" type="file" accept=".zip,application/zip"></label><select id="background" aria-label="背景"><option value="checker">市松背景</option><option value="white">白背景</option><option value="black">黒背景</option></select></div><div class="controls" style="margin-top:12px"><label for="importMode">読み込み方法</label><select id="importMode"><option value="replace">入れ替え（標準）</option><option value="append">追加</option></select><button id="showAll" type="button">保存済みをすべて表示</button></div><div class="status" id="status">読み込み中…</div><div class="notice">入れ替えは表示だけを変更し、画像と評価は削除しません。初期◯は未選抜です。Driveへは書き込みません。</div><div id="error"></div></header><section class="drive-panel"><strong>Google DriveからPNGを選ぶ</strong><p class="muted">特定のファイルのみ許可。評価は端末内に保存され、Driveには同期しません。</p><details><summary>初回設定（APIキー）</summary><label for="apiKey">Google Picker APIキー</label><input id="apiKey" placeholder="AIza..." autocomplete="off"></details><button id="driveConnect">Google DriveからPNGを選ぶ</button><button id="driveLogout">Google認証を解除</button><div class="drive-log" id="driveLog">準備中…</div></section><main class="list" id="list"></main><footer><button id="setAll">表示中を全件◯</button><button id="json">全選抜結果JSONを保存</button><button id="csv">全選抜結果CSVを保存</button></footer><p class="muted" style="max-width:620px;margin:auto">以前のデータと同じ保存領域を使用します。ブラウザのデータを削除すると失われる場合があります。定期的にJSONを保存してください。</p><dialog id="zoom"><button id="close">閉じる</button><div><img id="zoomimg" alt="拡大画像"></div></dialog>
<script>
'use strict';
// Keep original v9 localStorage + IndexedDB keys, image identities and ratings unchanged.
const STORE='sticker-selector-v9',DB='sticker-selector-images-v9',PICKER_KEY='sticker-selector-picker-api-key';
const CLIENT_ID='752498877311-oo7n6mj74h5ano8g8cusltgun01e4uji.apps.googleusercontent.com';
const PROJECT_NUMBER='752498877311';
const $=id=>document.getElementById(id);
let state;try{state=JSON.parse(localStorage.getItem(STORE))}catch(e){}
if(!state||!Array.isArray(state.items))state={items:[],background:'checker'};
// Display selection is stored separately; original v9 state is not migrated, deleted or reordered.
const VIEW_KEY='sticker-selector-v9-visible-ids';
let shownIds;try{const saved=JSON.parse(localStorage.getItem(VIEW_KEY));shownIds=Array.isArray(saved)?saved:null}catch(e){shownIds=null}
const visible=()=>shownIds===null?state.items:state.items.filter(x=>shownIds.includes(x.id));
function setView(ids){if(!ids.length)return;const unique=[...new Set(ids)];shownIds=$('importMode').value==='replace'?unique:[...new Set([...visible().map(x=>x.id),...unique])];localStorage.setItem(VIEW_KEY,JSON.stringify(shownIds))}
$('showAll').onclick=()=>{shownIds=null;localStorage.removeItem(VIEW_KEY);redraw()};
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
let db;
function openDb(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('images'))q.result.createObjectStore('images')};q.onsuccess=()=>{db=q.result;ok()};q.onerror=()=>no(q.error)})}
function put(id,blob){return new Promise((ok,no)=>{const q=db.transaction('images','readwrite').objectStore('images').put(blob,id);q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}
function get(id){return new Promise((ok,no)=>{const q=db.transaction('images','readonly').objectStore('images').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
let urls=[];function clearURLs(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[]}
function redraw(){clearURLs();$('background').value=state.background||'checker';const items=visible(),t={o:0,h:0,x:0};items.forEach(i=>{if(i.touched&&t[i.rating]!==undefined)t[i.rating]++});$('status').textContent=`表示${items.length}枚（保存済み${state.items.length}枚）/ ◯ ${t.o} / △ ${t.h} / ✕ ${t.x} / 未選抜 ${items.length-t.o-t.h-t.x}`;const list=$('list');list.replaceChildren();items.forEach((it,index)=>{const card=document.createElement('article');card.className='card';const stage=document.createElement('div');stage.className='stage '+(it.background||state.background||'checker');const img=document.createElement('img');img.alt=it.name;stage.append(img);card.append(stage);const meta=document.createElement('div');meta.className='meta';const filename=document.createElement('div');filename.className='filename';filename.textContent=`${index+1}. ${it.name}`;meta.append(filename);const perbg=document.createElement('div');perbg.className='per-bg';for(const [v,txt] of [['checker','市松'],['white','白'],['black','黒']]){const b=document.createElement('button');b.textContent=txt;if((it.background||state.background||'checker')===v)b.classList.add('active');b.onclick=()=>{it.background=v;save();stage.className='stage '+v;perbg.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))};perbg.append(b)}meta.append(perbg);const choices=document.createElement('div');choices.className='choices';for(const [v,txt] of [['o','◯'],['h','△'],['x','✕']]){const label=document.createElement('label');if(it.touched&&it.rating===v)label.classList.add('chosen');const input=document.createElement('input');input.type='radio';input.name='vote'+index;input.value=v;input.checked=!!it.touched&&it.rating===v;label.append(input,document.createTextNode(txt));input.onchange=()=>{it.rating=v;it.touched=true;save();redraw()};choices.append(label)}meta.append(choices);const comment=document.createElement('input');comment.className='comment';comment.placeholder='コメント（任意）';comment.value=it.comment||'';comment.oninput=e=>{it.comment=e.target.value;save()};meta.append(comment);const note=document.createElement('small');note.textContent=it.touched?'操作済':'未選抜（仮◯）';meta.append(note);card.append(meta);list.append(card);get(it.id).then(blob=>{if(blob){const u=URL.createObjectURL(blob);urls.push(u);img.src=u}else note.textContent='画像を再追加してください'}).catch(()=>note.textContent='画像読込失敗');img.onclick=()=>{if(img.src){$('zoomimg').src=img.src;$('zoom').showModal()}}})}
async function addPNG(blob,name){if(!name.toLowerCase().endsWith('.png'))return null;if(blob.size>15e6)throw Error('15MB超: '+name);const id=name+'|'+blob.size+'|'+blob.lastModified;if(state.items.some(x=>x.id===id))return id;await put(id,blob);state.items.push({id,name,rating:'o',touched:false,comment:''});save();return id}
$('files').onchange=async e=>{try{const ids=[];for(const f of e.target.files){const id=await addPNG(f,f.name);if(id)ids.push(id)}setView(ids);redraw()}catch(err){$('error').textContent=err.message}e.target.value=''};
$('zip').onchange=async e=>{try{if(!window.JSZip){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=ok;s.onerror=no;document.head.append(s)})}const zip=await JSZip.loadAsync(e.target.files[0]),ids=[];for(const f of Object.values(zip.files)){if(f.dir||!f.name.toLowerCase().endsWith('.png')||f.name.startsWith('__MACOSX/'))continue;const blob=await f.async('blob');const id=await addPNG(new File([blob],f.name.split('/').pop(),{type:'image/png'}),f.name);if(id)ids.push(id)}setView(ids);redraw()}catch(err){$('error').textContent='ZIP読込失敗: '+err.message}e.target.value=''};
let driveToken=null,driveClient=null,googleReady=false,googleLoading=null;
$('apiKey').value=localStorage.getItem(PICKER_KEY)||'';
function driveMessage(msg){$('driveLog').textContent=msg}
function withTimeout(p,ms,why){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(Error(why)),ms))])}
function loadScript(url,ready){return withTimeout(new Promise((ok,no)=>{if(ready())return ok();const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>ready()?ok():no(Error('API準備失敗'));s.onerror=()=>no(Error('Googleスクリプト読込失敗'));document.head.append(s)}),12000,'Googleライブラリ読込タイムアウト')}
function loadGoogle(){if(googleReady)return Promise.resolve();if(googleLoading)return googleLoading;googleLoading=(async()=>{driveMessage('Google認証ライブラリを読み込み中…');await Promise.all([loadScript('https://accounts.google.com/gsi/client',()=>!!window.google?.accounts?.oauth2),loadScript('https://apis.google.com/js/api.js',()=>!!window.gapi)]);await withTimeout(new Promise((ok,no)=>{try{gapi.load('picker',{callback:ok,onerror:()=>no(Error('Picker失敗'))})}catch(e){no(e)}}),12000,'Pickerタイムアウト');if(!window.google?.picker?.PickerBuilder)throw Error('Picker未利用');googleReady=true;driveMessage('準備完了。Google DriveからPNGを選べます')})().catch(e=>{driveMessage('準備失敗：'+e.message);throw e}).finally(()=>{googleLoading=null});return googleLoading}
loadGoogle().catch(()=>{});
async function importPicked(docs){let added=0,skipped=0;const ids=[];for(const doc of docs){const fid=doc.id,name=doc.name||doc.title||'image.png';if(!fid||!name.toLowerCase().endsWith('.png')){skipped++;continue}const id='drive:'+fid;if(state.items.some(x=>x.id===id)){ids.push(id);skipped++;continue}driveMessage('画像取得中 '+(added+skipped+1)+'/'+docs.length);try{const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fid)+'?alt=media',{headers:{Authorization:'Bearer '+driveToken}});if(!r.ok)throw Error('Drive API '+r.status);const blob=await r.blob();if(blob.size>15e6)throw Error('15MB超');await put(id,blob);state.items.push({id,name,rating:'o',touched:false,comment:'',drive_file_id:fid});ids.push(id);added++;save()}catch(e){setView(ids);redraw();driveMessage(added+'枚取得後に失敗：'+name+' '+e.message);return}}setView(ids);redraw();driveMessage('完了：新規'+added+'枚、既存/対象外'+skipped+'枚。Drive変更なし')}
function openPicker(){const key=$('apiKey').value.trim();if(!key)throw Error('APIキーを入力してください');localStorage.setItem(PICKER_KEY,key);const v=new google.picker.DocsView(google.picker.ViewId.DOCS);v.setMimeTypes('image/png');v.setMode(google.picker.DocsViewMode.LIST);const p=new google.picker.PickerBuilder().setDeveloperKey(key).setOAuthToken(driveToken).setAppId(PROJECT_NUMBER).setOrigin(location.origin).setLocale('ja').addView(v).enableFeature(google.picker.Feature.MULTISELECT_ENABLED).setCallback(data=>{if(data.action===google.picker.Action.PICKED)importPicked(data.docs||[]).catch(e=>driveMessage('読込失敗：'+e.message))}).build();p.setVisible(true);driveMessage('Google DriveでPNGを選んでください')}
$('driveConnect').onclick=()=>{const btn=$('driveConnect');if(!$('apiKey').value.trim()){driveMessage('初回設定のAPIキーを入力してください');return}if(!googleReady){loadGoogle().catch(()=>{});driveMessage('Google準備中。少し待って再度押してください');return}try{if(driveToken){openPicker();return}btn.disabled=true;driveMessage('認証画面を開いています…');let answered=false;const watchdog=setTimeout(()=>{if(!answered){btn.disabled=false;driveMessage('認証画面の応答なし。ポップアップ設定を確認してください')}},20000);driveClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:resp=>{answered=true;clearTimeout(watchdog);btn.disabled=false;if(resp.error){driveMessage('認証失敗：'+resp.error);return}if(!resp.access_token){driveMessage('認証トークンなし');return}driveToken=resp.access_token;try{openPicker()}catch(e){driveMessage('Picker失敗：'+e.message)}},error_callback:e=>{answered=true;clearTimeout(watchdog);btn.disabled=false;driveMessage('認証失敗：'+(e?.type||'不明'))}});driveClient.requestAccessToken({prompt:'consent'})}catch(e){btn.disabled=false;driveMessage('認証開始失敗：'+e.message)}};
$('driveLogout').onclick=()=>{if(driveToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(driveToken,()=>{});driveToken=null;driveClient=null;driveMessage('認証解除。端末の選抜データは残ります')};
$('background').onchange=e=>{state.background=e.target.value;state.items.forEach(x=>delete x.background);save();redraw()};$('close').onclick=()=>$('zoom').close();
$('setAll').onclick=()=>{if(!confirm('表示中の画像をすべて◯で操作済みにしますか？'))return;visible().forEach(x=>{x.rating='o';x.touched=true});save();redraw()};
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function exportRows(){return state.items.map(i=>({image_id:i.id,filename:i.name,rating:i.touched?i.rating:null,confirmed:!!i.touched,comment:i.comment||''}))}
$('json').onclick=()=>download('sticker-selection-v9.json',JSON.stringify({schema_version:9,drive_synced:false,exported_at:new Date().toISOString(),items:exportRows()},null,2),'application/json');
$('csv').onclick=()=>{const rows=[['image_id','filename','rating','confirmed','comment'],...exportRows().map(x=>[x.image_id,x.filename,x.rating||'',x.confirmed,x.comment])];download('sticker-selection-v9.csv',rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};
// Do not write state on initial page load: preserve original v9 localStorage content.
openDb().then(redraw).catch(e=>$('error').textContent='端末内画像を読み込めません：'+e.message);
</script></body></html>
